spring:
  datasource:
    # Test environment uses H2 in-memory database
    url: jdbc:h2:mem:splitfy-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 2525
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
splitfy:
  jwt:
    secret: test-secret-which-needs-at-least-32-bytes-123456
    expiration-ms: 3600000
  email:
    schedule:
      cache:
        max-age: 24h
  admin:
    email: admin@test.local
    password: Admin@Test123
  mail:
    from: no-reply@test.local
    retry:
      max-attempts: 1
      backoff-ms: 0
  exchange:
    timeout:
      connect-ms: 300
      read-ms: 500
    retry:
      max-attempts: 1
      backoff-ms: 0
  auth:
    reset-token-expiration-minutes: 15
    reset-token-max-attempts: 5
  security:
    cors:
      allowed-origins: http://localhost:4242,http://127.0.0.1:4242
    rate-limit:
      login-by-ip-per-minute: 30
      login-by-email-per-minute: 10
      forgot-by-ip-per-hour: 20
      forgot-by-email-per-hour: 5
      reset-by-ip-per-hour: 20
      reset-by-token-per-hour: 10

logging:
  level:
    root: WARN
