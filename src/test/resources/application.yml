spring:
  datasource:
    # Test environment uses H2 in-memory database
    url: jdbc:h2:mem:splitfy-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 2525

splitfy:
  jwt:
    secret: test-secret-which-needs-at-least-32-bytes-123456
    expiration-ms: 3600000
  admin:
    email: admin@test.local
    password: Admin@Test123
  mail:
    from: no-reply@test.local

logging:
  level:
    root: WARN
