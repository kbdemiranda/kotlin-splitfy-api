<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bem-vindo ao Splitfy</title>
    <style>
      @media only screen and (max-width: 620px) {
        .shell { width: 100% !important; }
        .content { padding: 20px !important; }
        .heading { font-size: 24px !important; line-height: 30px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#edf2f7;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;" th:text="${preheader}">Acesso criado com sucesso</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf2f7;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="680" cellspacing="0" cellpadding="0" class="shell" style="width:680px;max-width:680px;background:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:26px 32px;background:linear-gradient(120deg,#111827,#1d4ed8);">
                <p style="margin:0;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#bfdbfe;">Splitfy</p>
                <h1 class="heading" style="margin:8px 0 0;color:#ffffff;font-size:28px;line-height:34px;">Bem-vindo ao Splitfy</h1>
              </td>
            </tr>
            <tr>
              <td class="content" style="padding:28px 32px;">
                <p style="margin:0 0 10px;font-size:16px;line-height:24px;color:#1f2937;">Olá, <strong th:text="${name}">Usuário</strong>.</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:23px;color:#334155;">Seu usuário foi criado com sucesso.</p>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;">
                  <tr>
                    <td style="padding:14px 16px;">
                      <p style="margin:0 0 4px;font-size:12px;line-height:16px;color:#64748b;text-transform:uppercase;letter-spacing:.7px;">Login</p>
                      <p style="margin:0;font-size:16px;line-height:22px;color:#0f172a;font-weight:700;" th:text="${email}">email@splitfy.com</p>
                    </td>
                  </tr>
                </table>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 14px;">
                  <tr>
                    <td style="padding:12px 14px;border-left:4px solid #1d4ed8;background:#eff6ff;">
                      <p style="margin:0;font-size:14px;line-height:21px;color:#1e3a8a;">Se necessário, você pode alterar a senha nas configurações da conta.</p>
                    </td>
                  </tr>
                </table>

                <p style="margin:0;font-size:12px;line-height:18px;color:#64748b;">Se você não reconhece este cadastro, entre em contato com o suporte.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
