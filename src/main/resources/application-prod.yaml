spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Supabase exposes a Postgres-compatible connection string.
    # Replace with your Supabase DB connection URL or supply via environment variables.
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://db.supabase.co:5432/splitfy}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER:splitfy}
    password: ${SUPABASE_DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Production logging (reduce verbosity)
logging:
  level:
    root: INFO
    io.github.splitfy: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Security note: store SUPABASE_DB_PASSWORD and SUPABASE_JDBC_URL in environment or secret manager.
