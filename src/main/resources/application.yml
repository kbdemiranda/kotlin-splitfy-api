spring:
  application:
    name: kotlin-splitfy-api
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Defaults (can be overridden per-profile)
server:
  port: 8080

splitfy:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM}
  auth:
    reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
  security:
    rate-limit:
      login-by-ip-per-minute: ${AUTH_RATE_LIMIT_LOGIN_IP_PER_MINUTE:30}
      login-by-email-per-minute: ${AUTH_RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:10}
      forgot-by-ip-per-hour: ${AUTH_RATE_LIMIT_FORGOT_IP_PER_HOUR:20}
      forgot-by-email-per-hour: ${AUTH_RATE_LIMIT_FORGOT_EMAIL_PER_HOUR:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    customCssUrl: /swagger-ui/custom.css
