spring:
  application:
    name: kotlin-splitfy-api
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

# Defaults (can be overridden per-profile)
server:
  port: 8080

splitfy:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  mail:
    from: ${MAIL_FROM}
    retry:
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${MAIL_RETRY_BACKOFF_MS:500}
  auth:
    reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
  exchange:
    bcb:
      base-url: ${BCB_BASE_URL:https://olinda.bcb.gov.br}
      lookback-days: ${BCB_LOOKBACK_DAYS:10}
    fallback:
      base-url: ${EXCHANGE_FALLBACK_BASE_URL:https://api.frankfurter.app}
    timeout:
      connect-ms: ${EXCHANGE_TIMEOUT_CONNECT_MS:2000}
      read-ms: ${EXCHANGE_TIMEOUT_READ_MS:3000}
    retry:
      max-attempts: ${EXCHANGE_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${EXCHANGE_RETRY_BACKOFF_MS:300}
    cache:
      ttl-seconds: ${EXCHANGE_CACHE_TTL_SECONDS:300}
      max-stale-seconds: ${EXCHANGE_CACHE_MAX_STALE_SECONDS:21600}
  security:
    rate-limit:
      login-by-ip-per-minute: ${AUTH_RATE_LIMIT_LOGIN_IP_PER_MINUTE:30}
      login-by-email-per-minute: ${AUTH_RATE_LIMIT_LOGIN_EMAIL_PER_MINUTE:10}
      forgot-by-ip-per-hour: ${AUTH_RATE_LIMIT_FORGOT_IP_PER_HOUR:20}
      forgot-by-email-per-hour: ${AUTH_RATE_LIMIT_FORGOT_EMAIL_PER_HOUR:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
