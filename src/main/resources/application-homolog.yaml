spring:
  config:
    activate:
      on-profile: homolog
  datasource:
    # Homolog (staging) uses a Postgres-compatible DB
    url: ${HOMOLOG_JDBC_URL:jdbc:postgresql://localhost:25432/splitfy_homlog}
    driver-class-name: org.postgresql.Driver
    username: ${HOMOLOG_DB_USER:splitfy_homolog}
    password: ${HOMOLOG_DB_PASSWORD:secret_homolog}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    io.github.splitfy: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
