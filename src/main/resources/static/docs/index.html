<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitfy API Docs</title>
    <style>
      :root {
        --bg: #0b1220;
        --nav: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #7c3aed;
        --border: #1e293b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .docs-header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--primary);
        box-shadow: 0 0 14px rgba(124, 58, 237, 0.85);
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
      }

      .docs-container {
        flex: 1;
        min-height: 0;
      }

      rapi-doc {
        height: 100%;
        width: 100%;
      }
    </style>
    <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
  </head>
  <body>
    <header class="docs-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Splitfy API</span>
      </div>
      <div class="subtitle">Developer Documentation</div>
    </header>

    <main class="docs-container">
      <rapi-doc
        spec-url="/v3/api-docs"
        render-style="read"
        allow-try="true"
        show-header="true"
        show-info="true"
        heading-text="Splitfy API"
        theme="dark"
        bg-color="#0b1220"
        text-color="#e5e7eb"
        nav-bg-color="#0f172a"
        nav-text-color="#e5e7eb"
        nav-hover-bg-color="#1e293b"
        nav-hover-text-color="#ffffff"
        primary-color="#7c3aed"
        regular-font="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif"
        mono-font="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
      >
      </rapi-doc>
    </main>
  </body>
</html>
