spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Homolog (staging) uses a Postgres-compatible DB
    url: ${HOMOLOG_JDBC_URL:jdbc:postgresql://localhost:25432/splitfy}
    driver-class-name: org.postgresql.Driver
    username: ${HOMOLOG_DB_USER:postgres}
    password: ${HOMOLOG_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: DEBUG
    io.github.splitfy: DEBUG
