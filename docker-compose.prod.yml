services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: splitfy-api:local
    container_name: splitfy-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-Splitfy <no-reply@splitfy.local>}
      SPLITFY_BILLING_PIX_KEY: ${PIX_KEY:-123.456.789-00}
      SPLITFY_BILLING_PIX_COPY_PASTE: ${PIX_COPY_PASTE:-123.456.789-00}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@splitfy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4242,http://127.0.0.1:4242}
      # Production stack owns its Redis instance; do not depend on a Redis
      # container from another Compose project or on the host network.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-9090}:8080"

  frontend:
    build:
      context: ../angular-splitfy-frontend
      dockerfile: Dockerfile
    image: angular-splitfy-frontend:local
    container_name: splitfy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4242}:4242"

  redis:
    image: redis:7-alpine
    container_name: splitfy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-16379}:6379"
    volumes:
      - splitfy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  splitfy_redis_data:
