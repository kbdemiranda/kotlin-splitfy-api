services:
  db:
    image: kbdemiranda/postgres:multiarch
    container_name: splitfy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitfy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "35432:5432"
    volumes:
      - splitfy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splitfy"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: splitfy-api:local
    container_name: splitfy-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_GENERATE_DDL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO: update
      DB_URL: jdbc:postgresql://db:5432/splitfy
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-Splitfy <no-reply@splitfy.local>}
      SPLITFY_BILLING_PIX_KEY: ${PIX_KEY:-123.456.789-00}
      SPLITFY_BILLING_PIX_COPY_PASTE: ${PIX_COPY_PASTE:-123.456.789-00}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@splitfy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "9090:8080"

  frontend:
    build:
      context: ../angular-splitfy-frontend
      dockerfile: Dockerfile.dev
    image: angular-splitfy-frontend:local
    container_name: splitfy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "4242:4242"
    volumes:
      - ../angular-splitfy-frontend:/app
      - splitfy_frontend_node_modules:/app/node_modules

volumes:
  splitfy_postgres_data:
  splitfy_frontend_node_modules:
