services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kbdemiranda/kotlin-splitfy-api:local
    container_name: splitfy-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-Splitfy <no-reply@splitfy.local>}
      SPLITFY_BILLING_PIX_KEY: ${PIX_KEY:-123.456.789-00}
      SPLITFY_BILLING_PIX_COPY_PASTE: ${PIX_COPY_PASTE:-123.456.789-00}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@splitfy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4242,http://127.0.0.1:4242}
    depends_on:
      - redis
    ports:
      - "9090:8080"

  frontend:
    build:
      context: ../angular-splitfy-frontend
      dockerfile: Dockerfile.dev
    image: kbdemiranda/angular-splitfy-frontend:local
    container_name: splitfy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080
    ports:
      - "4242:4242"
    volumes:
      - ../angular-splitfy-frontend:/app
      - splitfy_frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0 --port 4242"
  redis:
    image: redis:7-alpine
    container_name: splitfy-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: [ "redis-server", "--port", "6379", "--appendonly", "yes" ]
volumes:
  splitfy_frontend_node_modules:
